name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (Lint + Typecheck + Test + Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm exec tsc --noEmit

      - name: Lint application and backend
        run: pnpm lint

      - name: Test database migrations and isolation
        run: pnpm test:db

      - name: Test server processing
        run: pnpm test:server

      - name: Run tests (vitest)
        run: pnpm exec vitest run

      - name: Build (vite + PWA)
        run: pnpm exec vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests (Playwright)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm exec vite build

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium

  deploy-preview:
    name: Deploy Preview (Vercel)
    needs: validate
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel Preview
        run: vercel --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy Production (Vercel)
    needs: [validate, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel Production
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Smoke test post-deploy: la app debe responder y ser Declarix.
      # Si falla, el workflow queda en rojo → revisar/revertir de inmediato.
      - name: Post-deploy smoke test
        run: |
          sleep 20
          for i in 1 2 3; do
            BODY=$(curl -fsSL --max-time 15 https://declarix.vercel.app/login) && break
            echo "Intento $i falló, reintentando en 10s..." && sleep 10
          done
          echo "$BODY" | grep -qi "Declarix" || { echo "El HTML no contiene 'Declarix'"; exit 1; }
          echo "Smoke test OK"
