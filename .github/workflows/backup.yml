name: Backup diario de la base de datos

# El tier gratuito de Supabase no incluye respaldos: este workflow hace un
# pg_dump diario, verifica una restauración de datos y cifra el artifact (30 días).
# Los artifacts de un repositorio público NO son privados.
# Usa .github/backup-recipients.txt (clave pública age). La clave privada
# de recuperación debe conservarse fuera de GitHub. Nunca subir dumps sin cifrar.
#
# Requiere el secret SUPABASE_DB_URL con la cadena de conexión
# "Session pooler" (IPv4) del proyecto:
#   Dashboard → Project Settings → Database → Connection string → Session pooler
#   postgresql://postgres.<ref>:<PASSWORD>@aws-0-<region>.pooler.supabase.com:5432/postgres
#
# Restaurar en un entorno aislado, después de descifrar con age -d -i <clave>.
# Este dump contiene metadata de Storage, no los bytes de los originales.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backup.yml
      - .github/backup-recipients.txt
      - scripts/verify-backup.mjs
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC ≈ 03:00 Chile
  workflow_dispatch:        # permite ejecutarlo a mano desde Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verificar configuración
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::error::Falta SUPABASE_DB_URL. No se publicará un respaldo sin cifrar."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Instalar age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Dump de la base (pg_dump 17 vía Docker)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          FECHA=$(date -u +%Y%m%d)
          docker run --rm postgres:17-alpine \
            pg_dump "$DB_URL" --no-owner --no-privileges --clean --if-exists \
            | gzip > "declarix-backup-${FECHA}.sql.gz"
          pnpm verify:backup "declarix-backup-${FECHA}.sql.gz" > "$RUNNER_TEMP/backup-verification.json"
          echo "Restauración de datos verificada; informe retenido solo en el runner."

      - name: Cifrar el respaldo verificado
        run: |
          set -euo pipefail
          for file in declarix-backup-*.sql.gz; do
            age -R .github/backup-recipients.txt -o "$file.age" "$file"
            rm -- "$file"
          done

      - name: Subir artifact (retención 30 días)
        uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_id }}
          path: declarix-backup-*.sql.gz.age
          retention-days: 30
          if-no-files-found: error
